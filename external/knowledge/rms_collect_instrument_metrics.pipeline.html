<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>rms Pipeline - optest-agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Mono',Consolas,'Liberation Mono',monospace;background:#0d1117;color:#c9d1d9;padding:16px 24px;font-size:13px}
header{text-align:center;margin-bottom:20px}
header h1{font-size:20px;color:#58a6ff;font-weight:600}
.sub{font-size:12px;color:#8b949e;margin-top:2px}
.abar{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;padding:14px 20px;background:#161b22;border:1px solid #30363d;border-radius:8px;margin-bottom:20px}
.abar .ai{text-align:center;min-width:100px}
.abar .ai .v{font-size:18px;font-weight:700}
.abar .ai .l{font-size:10px;color:#8b949e;margin-top:2px;text-transform:uppercase;letter-spacing:0.5px}
.mb .v{color:#f97583}
.cb .v{color:#85e89d}
.bl .v{color:#ffdf5d}
section{margin-bottom:28px}
section h2{font-size:14px;color:#79c0ff;margin-bottom:10px;padding-bottom:4px;border-bottom:1px solid #21262d}
.gantt{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:12px;overflow-x:auto}
.gr{display:flex;align-items:center;margin-bottom:3px;height:24px}
.gl{width:180px;min-width:180px;font-size:11px;color:#8b949e;text-align:right;padding-right:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gt{flex:1;position:relative;height:20px;background:#161b22;border-radius:2px}
.gb{position:absolute;height:100%;border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;min-width:1px;transition:filter .12s}
.gb:hover{filter:brightness(1.3);z-index:10}
.gb .bt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 3px;pointer-events:none}
.dma-load{background:#1f6feb}
.dma-store{background:#8957e5}
.simd{background:#3fb950}
.host-dma-h2d{background:#1f6feb}
.host-dma-d2h{background:#8957e5}
.host-kernel{background:#f85149}
.bubble{background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.15)}
.ta{display:flex;align-items:center;margin-bottom:6px;height:16px}
.ta .gl{font-size:9px;color:#484f58}
.ta .gt{display:flex;justify-content:space-between;font-size:9px;color:#484f58;padding:0 2px}
.legend{display:flex;gap:14px;margin-bottom:10px;flex-wrap:wrap}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:#8b949e}
.lc{width:12px;height:12px;border-radius:2px;display:inline-block}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.sc{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:12px}
.sc h3{font-size:11px;color:#79c0ff;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.sc .m{display:flex;justify-content:space-between;padding:2px 0;font-size:12px}
.sc .m .k{color:#8b949e}
.sc .m .v{color:#c9d1d9;font-weight:600}
.tip{position:fixed;bottom:16px;right:16px;background:#1c2128;border:1px solid #58a6ff;border-radius:6px;padding:12px 16px;max-width:360px;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.5);font-size:12px}
.tip h4{color:#58a6ff;margin-bottom:6px;font-size:13px}
.tip .r{display:flex;justify-content:space-between;padding:2px 0;gap:12px}
.tip .r .k{color:#8b949e}
.tip .x{position:absolute;top:6px;right:10px;cursor:pointer;color:#8b949e;font-size:14px}
.tip .x:hover{color:#fff}
.spe-sep{border-top:1px solid #21262d;margin:6px 0}
</style>
</head>

(function(){
const D2=D;
const a=D2.analysis;
const ab=document.getElementById('analysis-bar');
const bc=a.bottleneck_type==='memory_bound'?'mb':a.bottleneck_type==='compute_bound'?'cb':'bl';
ab.innerHTML=`
<div class="ai ${bc}"><div class="v">${a.bottleneck_label}</div><div class="l">瓶颈类型</div></div>
<div class="ai"><div class="v">${a.dma_compute_ratio}x</div><div class="l">DMA/Compute</div></div>
<div class="ai"><div class="v">${(a.bubble_ratio*100).toFixed(1)}%</div><div class="l">Bubble Ratio</div></div>
<div class="ai"><div class="v">${fmtNs(a.host_kernel_ns)}</div><div class="l">Host Kernel</div></div>
<div class="ai"><div class="v">${a.spe_count}</div><div class="l">SPEs</div></div>`;

renderHost();
renderDevice();
renderSummary();

function renderHost(){
  const c=document.getElementById('host-gantt');
  const evts=D2.host_events;
  if(!evts.length){c.innerHTML='<p style="color:#484f58">No host events</p>';return}
  const t0=evts[0].start_ns, t1=evts[evts.length-1].end_ns, rng=t1-t0||1;
  let h=timeAxis(rng);
  for(const e of evts){
    const l=(e.start_ns-t0)/rng*100, w=Math.max(.5,e.duration_ns/rng*100);
    const cls=e.direction==='h2d'?'host-dma-h2d':e.direction==='d2h'?'host-dma-d2h':'host-kernel';
    const bw=e.bandwidth_GBps?` ${(+e.bandwidth_GBps).toFixed(1)}GB/s`:'';
    h+=row(e.label,`<div class="gb ${cls}" style="left:${l}%;width:${w}%" onclick="tip(this)" data-l="${esc(e.label)}" data-d="${fmtNs(e.duration_ns)}" data-b="${fmtB(e.bytes)}" data-bw="${bw}"><span class="bt">${w>4?fmtNs(e.duration_ns)+bw:''}</span></div>`);
  }
  c.innerHTML=h;
}

function renderDevice(){
  const c=document.getElementById('device-gantt');
  const tl=D2.device_timeline;
  if(!tl.length){c.innerHTML='<p style="color:#484f58">No device data</p>';return}
  const mx=Math.max(...tl.map(t=>t.total_ns))||1;
  let h=timeAxis(mx);
  for(let si=0;si<tl.length;si++){
    const spe=tl[si];
    if(si>0)h+='<div class="spe-sep"></div>';
    h+=row(`SPE ${spe.spe_id} DMA`,renderTrack(spe.dma_track,mx));
    h+=row(`SPE ${spe.spe_id} Compute`,renderTrack(spe.compute_track,mx));
  }
  c.innerHTML=h;
}

function renderTrack(track,mx){
  let h='<div class="gt">';
  for(const s of track){
    const l=s.start_ns/mx*100, w=Math.max(.3,s.duration_ns/mx*100);
    h+=`<div class="gb ${s.category}" style="left:${l}%;width:${w}%" onclick="tip(this)" data-l="${esc(s.label)}" data-d="${fmtNs(s.duration_ns)}" data-bw="${s.bandwidth_GBps}GB/s" data-b="${fmtB(s.bytes_per_chunk)}" data-i="${esc(s.info)}"><span class="bt">${w>3?esc(s.label):''}</span></div>`;
  }
  h+='</div>';
  return h;
}

function timeAxis(rng){
  let h='<div class="ta"><div class="gl">Time</div><div class="gt">';
  for(let i=0;i<=5;i++)h+=`<span>${fmtNs(rng*i/5)}</span>`;
  h+='</div></div>';
  return h;
}

function row(label,inner){return `<div class="gr"><div class="gl" title="${esc(label)}">${esc(label)}</div>${inner.startsWith('<div class="gt"')?inner:'<div class="gt">'+inner+'</div>'}</div>`}

function renderSummary(){
  const s=document.getElementById('summary');
  const cards=[
    {t:'Bottleneck Analysis',m:[
      ['Type',a.bottleneck_label],
      ['DMA/Compute Ratio',a.dma_compute_ratio+'x'],
      ['Bubble Ratio',(a.bubble_ratio*100).toFixed(1)+'%'],
      ['Detail',a.bottleneck_detail]]},
    {t:'Per-SPE Average',m:[
      ['DMA Load',fmtNs(a.avg_dma_load_ns)],
      ['DMA Store',fmtNs(a.avg_dma_store_ns)],
      ['SIMD Compute',fmtNs(a.avg_simd_ns)],
      ['DMA Total',fmtNs(a.dma_total_per_spe_ns)],
      ['Compute Total',fmtNs(a.compute_total_per_spe_ns)],
      ['Bubble',fmtNs(a.avg_bubble_ns)]]},
    {t:'Host Timing',m:[
      ['Kernel Launch+Sync',fmtNs(a.host_kernel_ns)],
      ['End-to-End',fmtNs(a.host_total_ns)]]},
    {t:'Parallelism',m:[
      ['Active SPEs',a.spe_count]]},
  ];
  let h='';
  for(const c of cards){
    h+=`<div class="sc"><h3>${esc(c.t)}</h3>`;
    for(const [k,v] of c.m)h+=`<div class="m"><span class="k">${esc(k)}</span><span class="v">${esc(String(v))}</span></div>`;
    h+='</div>';
  }
  s.innerHTML=h;
}

window.tip=function(el){
  const t=document.getElementById('tip');
  let h=`<span class="x" onclick="this.parentElement.style.display='none'">&times;</span><h4>${el.dataset.l||''}</h4>`;
  h+=r('Duration',el.dataset.d||'');
  if(el.dataset.b&&el.dataset.b!=='-')h+=r('Bytes',el.dataset.b);
  if(el.dataset.bw&&el.dataset.bw!=='0GB/s')h+=r('Bandwidth',el.dataset.bw);
  if(el.dataset.i)h+=r('Info',el.dataset.i);
  t.innerHTML=h;t.style.display='block';
};
function r(k,v){return `<div class="r"><span class="k">${esc(k)}</span><span class="v">${esc(String(v))}</span></div>`}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmtNs(ns){
  ns=+ns;if(isNaN(ns))return'-';
  if(ns>=1e9)return(ns/1e9).toFixed(2)+'s';
  if(ns>=1e6)return(ns/1e6).toFixed(2)+'ms';
  if(ns>=1e3)return(ns/1e3).toFixed(1)+'us';
  return ns.toFixed(0)+'ns';
}
function fmtB(b){if(!b||b<=0)return'-';if(b>=1e6)return(b/1e6).toFixed(1)+'MB';if(b>=1e3)return(b/1e3).toFixed(1)+'KB';return b+'B'}
})();
